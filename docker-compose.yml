services:
  db:
    image: postgres:15-alpine
    ports:
      - "${DB_PORT_EXTERNAL:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-document_base}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - docker-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-document_base}
      SERVER_PORT: ${SERVER_PORT:-8082}
      SERVER_HOST: "0.0.0.0"
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8080}
      CLIENT_ID: ${CLIENT_ID:-document-base-clientid}
      CLIENT_SECRET: ${CLIENT_SECRET:-document-base-clientsecret}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SERVER_PORT:-8082}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - docker-db

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:${SERVER_PORT:-8082}
        REACT_APP_AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:8080}
        REACT_APP_CLIENT_ID: ${CLIENT_ID:-document-base-clientid}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - docker-db

volumes:
  postgres_data:
